<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iron-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f33"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="iron-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddff33"/>
      <stop offset="100%" stop-color="#b3e600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#c3f400" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Obsidian Badge Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#iron-bg)" stroke="#c3f400" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Dumbbell Icon rotated 45deg -->
  <g transform="rotate(-45 32 32)" filter="url(#glow)">
    <!-- Central Grip Handle -->
    <rect x="20" y="29.5" width="24" height="5" rx="2.5" fill="#f0f6ff"/>
    <line x1="28" y1="29.5" x2="28" y2="34.5" stroke="#171f33" stroke-width="1.2"/>
    <line x1="32" y1="29.5" x2="32" y2="34.5" stroke="#171f33" stroke-width="1.2"/>
    <line x1="36" y1="29.5" x2="36" y2="34.5" stroke="#171f33" stroke-width="1.2"/>

    <!-- Left Weight Plates -->
    <rect x="15" y="19" width="5" height="26" rx="2" fill="url(#iron-lime)"/>
    <rect x="9" y="22.5" width="5.2" height="19" rx="2" fill="url(#iron-lime)"/>
    <rect x="5.5" y="26" width="3" height="12" rx="1.5" fill="#9cf0ff"/>

    <!-- Right Weight Plates -->
    <rect x="44" y="19" width="5" height="26" rx="2" fill="url(#iron-lime)"/>
    <rect x="49.8" y="22.5" width="5.2" height="19" rx="2" fill="url(#iron-lime)"/>
    <rect x="55.5" y="26" width="3" height="12" rx="1.5" fill="#9cf0ff"/>
  </g>
</svg>
